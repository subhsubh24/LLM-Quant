# Lint standard for LLM-Quant (ROADMAP F7 — "lint-at-zero" ratchet).
#
# This file PINS what "clean" means for the FULL ruleset (the target the ratchet drives
# toward). What is ENFORCED in CI today is NARROWER: scripts/preflight.sh step 3 runs
# `ruff check --select E9,F821,F811 backend/app` (correctness-only — syntax/runtime
# errors, undefined names, redefinition/shadowing) and `ruff` IS in
# backend/requirements-ci.txt, so that correctness gate is LIVE in the required check
# (#149, 2026-07-02). The tree is at zero for E9/F821/F811, so the gate can only ever red
# on a genuinely NEW correctness defect — never on style.
#
# The remaining ~130 findings under the full selection below are cosmetic HYGIENE
# (F401/E402/F841/E741 — not correctness bugs); they stay UNENFORCED until driven to zero
# module-by-module, at which point the `--select` widens to this full ruleset (F7). Until
# then this file is the stable, meaningful TARGET count; preflight.sh enforces the
# correctness subset. (See docs/ci/PROPOSED_CI.md §A2.)

target-version = "py311"
line-length = 100

[lint]
# Ruff defaults (E4/E7/E9 + F). Explicit so the standard is legible and stable.
select = ["E4", "E7", "E9", "F", "W"]

[lint.per-file-ignores]
# Driver/CLI scripts legitimately set sys.path BEFORE importing the app package, so
# module-level imports cannot all sit at the very top — E402 is expected there.
"scripts/*.py" = ["E402"]
# Tests may shadow/redefine fixtures and import for side effects.
"backend/tests/*.py" = ["F811", "F401"]
