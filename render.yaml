# Render blueprint — one-click backend deploy.
#
# The FastAPI backend is a STATEFUL, ALWAYS-ON service (continuous scan loop, live
# WebSocket feeds, in-memory positions/risk state) — NOT serverless. It belongs on a
# persistent host like this. See docs/DEPLOYMENT.md for the architecture decision.
#
# Usage: in Render -> New -> Blueprint -> point at this repo. Then set the secret
# env vars (marked sync:false) in the dashboard. The frontend goes on Vercel
# (see docs/DEPLOYMENT.md); to run it here too, add a second web service.
#
# NOTE: the heavy stock/crypto ML stack (torch/xgboost/lightgbm) has been REMOVED
# (ROADMAP A1, prediction-markets-only). The backend still pulls scientific deps
# (numpy/scipy/pandas/scikit-learn/cvxpy), so `starter` (~1GB RAM) remains the safe
# minimum; the free tier may still be tight.

services:
  - type: web
    name: llm-quant-backend
    runtime: python
    plan: starter            # >= 1GB RAM (scientific deps); free tier may be tight. ~$7/mo.
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Safe defaults (real money stays OFF) ---
      - key: LIVE_TRADING_ENABLED
        value: "false"        # owner-only master gate; never enable here
      - key: DEMO_MODE
        value: "true"
      - key: DEBUG
        value: "false"
      # --- Secrets / per-deploy (set these in the Render dashboard) ---
      - key: DATABASE_URL       # Neon Postgres pooled connection string (?sslmode=require)
        sync: false
      - key: CORS_ALLOW_ORIGINS # your Vercel origin, e.g. https://llm-quant.vercel.app
        sync: false
      - key: GEMINI_API_KEY     # optional (LLM analysis; degrades to templates if unset)
        sync: false
      # Control routes are DEFAULT-CLOSED (#129): with no token they return 401. On a public
      # deploy set BACKEND_API_TOKEN; on a trusted single-user host set BACKEND_AUTH_DISABLED=1
      # instead. See PENDING_OPS OA-14 / docs/DEPLOYMENT.md.
      - key: BACKEND_API_TOKEN  # public deploys: set this (else control routes 401)
        sync: false
      - key: BACKEND_AUTH_DISABLED  # dev/paper opt-out instead of a token; NEVER with LIVE_TRADING_ENABLED
        sync: false
      # NOTE: LIVE venue keys (POLYMARKET_*) + LIVE_TRADING_ENABLED are HUMAN-CORE and
      # set ONLY when going live — never here. Paper (the default) needs no venue keys.
      # See docs/growth/LIVE_RUNBOOK.md.
