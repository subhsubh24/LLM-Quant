name: preflight

# Wires scripts/preflight.sh into CI.
#  - gate (BLOCKING): the code+safety scope that must always pass — import smoke,
#    prediction/risk tests, secret scan, YAML blocks, the live-gate default, the
#    kill-switch presence, and the runtime harness (live gate blocks real orders,
#    kill switch halts trading, paper pipeline deterministic).
#  - go-live-status (NON-BLOCKING): the full gate including the profit-floor + DoD
#    go-live checks. This is EXPECTED to be red until a validated out-of-sample edge
#    exists; it's informational so it never blocks merges.

on:
  pull_request:
  push:
    branches: ["claude/llm-stock-trading-app-fXupf"]
  workflow_dispatch:

jobs:
  gate:
    name: code + safety gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install light gate deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt
      - name: Run preflight (code scope)
        run: bash scripts/preflight.sh code

  go-live-status:
    # PURELY INFORMATIONAL — reports go-live readiness without ever failing. The full
    # gate is honest-red (profit floor + DoD + quality) until a validated edge exists,
    # so we capture its result and surface it as a notice rather than a red error that
    # looks like (or could mask) a real failure. Merges are gated by the `gate` job only.
    name: go-live readiness (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install light gate deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ci.txt
      - name: Report go-live readiness (full gate, never fails)
        run: |
          set +e
          bash scripts/preflight.sh
          code=$?
          echo ""
          if [ "$code" -eq 0 ]; then
            echo "::notice title=Go-live readiness::GREEN — go-live-eligible (all gates pass)."
          else
            echo "::notice title=Go-live readiness::NOT YET ELIGIBLE — expected until a validated out-of-sample edge exists. Informational only; does not block merges."
          fi
          exit 0
